name: GeraKStoreiOS
options:
  bundleIdPrefix: com.gerak
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: GeraKStore
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
targets:
  GeraKStoreiOS:
    type: application
    platform: iOS
    sources:
      - path: Config
      - path: Models
      - path: Services
      - path: Views
      - path: GeraKStoreApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerak.store
        PRODUCT_NAME: GeraKStore
        CODE_SIGN_STYLE: Automatic
