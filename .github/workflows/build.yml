name: Сборка GeraKStore IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Компиляция Swift и сборка IPA
    runs-on: macos-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Сборка исполняемого файла и IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: GeraKStore-IPA
          path: GeraKStore.ipa
          retention-days: 7
