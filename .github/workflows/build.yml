name: Сборка GeraKStore IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка и упаковка IPA
    runs-on: macos-14

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Запуск скрипта сборки
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Загрузка готового IPA в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: GeraKStore-Release-IPA
          path: GeraKStore.ipa
          retention-days: 14
